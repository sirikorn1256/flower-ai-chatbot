<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      .bloomie-circle { fill: #FFFFFF; stroke: #E4DCD3; stroke-width: 1.5; }
      .bloomie-line { fill: none; stroke: #3A352F; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .bloomie-text { font-family: 'Cormorant Garamond', 'Georgia', serif; font-size: 11px; fill: #3A352F; text-anchor: middle; font-weight: 600; letter-spacing: 0.5px; }
    </style>
  </defs>
  <circle cx="60" cy="60" r="56" class="bloomie-circle" />
  
  <!-- Rose Blossom Line-Art -->
  <g transform="translate(0, -6)">
